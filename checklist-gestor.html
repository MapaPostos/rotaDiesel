  :root[data-theme="dark"] {
    --paper: #14171a; --paper-2: #1b1f22; --ink: #ece9e1; --ink-soft: #9aa0a4;
    --route: #ff8f47; --route-soft: #3a2414; --ok: #4cb383; --ok-soft: #173327; --nok: #e0685a; --nok-soft: #3a221d;
    --card: #1e2225; --border: #33383c; --shadow: rgba(0,0,0,.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .brand { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .01em; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }

  header {
    background: var(--asphalt); color: var(--header-ink);
    padding: 14px 16px; margin: 0 0 16px;
    border-bottom: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--brand-1), var(--brand-2), var(--brand-3)) 1;
    display: flex; align-items: center; gap: 10px;
  }
  header a { color: var(--header-ink); text-decoration: none; font-size: 13px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  select, input[type=text], input[type=date] {
    width: 100%; padding: 10px 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--paper-2); color: var(--ink); font-size: 13.5px; font-family: inherit; outline: none;
  }
  .filtergrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; }
  @media (max-width: 760px) { .filtergrid { grid-template-columns: 1fr 1fr; } }
  .btn { padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 13.5px; border: none; cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--route); color: #fff; }
  .btn.ghost { background: var(--paper-2); color: var(--ink); border: 1px solid var(--border); }

  .summary { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .summary .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; font-size: 12.5px; color: var(--ink-soft); }
  .summary .stat b { display: block; font-size: 20px; color: var(--ink); font-family: 'Barlow Condensed', sans-serif; }

  .resultcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .resultrow { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .resultrow .tipo-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-soft); flex: none; }
  .resultrow .info { flex: 1; min-width: 0; }
  .resultrow .motorista { font-weight: 600; font-size: 14px; }
  .resultrow .sub { font-size: 12px; color: var(--ink-soft); }
  .resultrow .pct { font-weight: 800; font-size: 17px; font-family: 'Barlow Condensed', sans-serif; flex: none; }
  .resultrow .pct.ok { color: var(--ok); } .resultrow .pct.warn { color: var(--route); } .resultrow .pct.bad { color: var(--nok); }
  .resultdetail { display: none; border-top: 1px solid var(--border); padding: 12px 16px; font-size: 12.5px; }
  .resultdetail.open { display: block; }
  .resultdetail .noklist { margin: 8px 0 0; padding-left: 18px; }
  .resultdetail .noklist li { color: var(--nok); margin-bottom: 4px; }
  .resultdetail a.pdf { display: inline-block; margin-top: 8px; color: var(--route); font-weight: 600; text-decoration: none; }

  .empty { padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  .msg { font-size: 13px; text-align: center; margin-top: 8px; }
  .msg.err { color: var(--nok); }

  #loginGate { max-width: 380px; margin: 60px auto; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1 class="brand">Painel de Checklists</h1>
    <a href="checklists.html" id="sairLink">Sair</a>
  </header>

  <div class="wrap">
    <div id="loginGate" class="card hidden">
      <p>Você precisa entrar como gestor para ver este painel.</p>
      <a href="checklists.html" class="btn primary" style="text-decoration:none; display:inline-block;">Ir para o login</a>
    </div>

    <div id="panelApp">
      <div class="card">
        <div class="filtergrid">
          <div>
            <label for="fTipo">Tipo</label>
            <select id="fTipo">
              <option value="">Todos</option>
              <option value="veiculo">Checklist de Veículo</option>
              <option value="diario">Checklist Diário</option>
            </select>
          </div>
          <div>
            <label for="fMotorista">Motorista</label>
            <select id="fMotorista"><option value="">Todos</option></select>
          </div>
          <div>
            <label for="fPlaca">Placa</label>
            <input type="text" id="fPlaca" placeholder="Ex.: ABC1D23" style="text-transform:uppercase;">
          </div>
          <div>
            <label for="fDataDe">De</label>
            <input type="date" id="fDataDe">
          </div>
          <div>
            <label for="fDataAte">Até</label>
            <input type="date" id="fDataAte">
          </div>
        </div>
        <div style="margin-top:12px; display:flex; gap:10px;">
          <button class="btn primary" id="filtrarBtn">Filtrar</button>
          <button class="btn ghost" id="limparBtn">Limpar filtros</button>
        </div>
      </div>

      <div class="summary" id="summaryWrap"></div>
      <div id="resultsWrap"><div class="empty">Carregando...</div></div>
      <div class="msg err" id="panelMsg"></div>
    </div>
  </div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkxZpP4eeVssIpNLuJq8dlc3ljWG-4qAj6sk7GXYnaMjFTaypwqst6UVqMRHieEht3/exec";

  const chkPass = sessionStorage.getItem('traxia_chk_pass');
  const chkTipo = sessionStorage.getItem('traxia_chk_tipo');
  if (!chkPass || chkTipo !== 'gestor') {
    document.getElementById('panelApp').classList.add('hidden');
    document.getElementById('loginGate').classList.remove('hidden');
  }

  document.getElementById('sairLink').addEventListener('click', () => {
    sessionStorage.removeItem('traxia_chk_pass');
    sessionStorage.removeItem('traxia_chk_tipo');
    sessionStorage.removeItem('traxia_chk_nome');
    sessionStorage.removeItem('traxia_chk_placa');
  });

  let jsonpCounter = 0;
  function jsonpRequest(params) {
    return new Promise((resolve, reject) => {
      const cbName = '__traxia_chk_cb_' + (jsonpCounter++) + '_' + Date.now();
      const script = document.createElement('script');
      const timeoutId = setTimeout(() => { cleanup(); reject(new Error('Tempo esgotado ao falar com o servidor.')); }, 20000);
      function cleanup() { clearTimeout(timeoutId); delete window[cbName]; script.remove(); }
      window[cbName] = (data) => { cleanup(); resolve(data); };
      const qs = new URLSearchParams();
      Object.entries(params).forEach(([k, v]) => qs.set(k, String(v)));
      qs.set('callback', cbName);
      script.src = `${APPS_SCRIPT_URL}?${qs.toString()}`;
      script.onerror = () => { cleanup(); reject(new Error('Falha ao carregar o servidor.')); };
      document.body.appendChild(script);
    });
  }
  function callApi(action, extra) { return jsonpRequest({ action, senha: chkPass, ...(extra || {}) }); }

  async function loadMotoristas() {
    try {
      const res = await callApi('chk_list_motoristas', {});
      if (!res.ok) return;
      const sel = document.getElementById('fMotorista');
      sel.innerHTML = '<option value="">Todos</option>' + res.motoristas.map(m => `<option value="${m.nome.replace(/"/g,'&quot;')}">${m.nome}</option>`).join('');
    } catch (e) { /* silencioso */ }
  }

  function pctClass(pct) { return pct >= 90 ? 'ok' : pct >= 70 ? 'warn' : 'bad'; }

  function renderResults(veiculoRows, diarioRows) {
    const wrap = document.getElementById('resultsWrap');
    const tipo = document.getElementById('fTipo').value;
    const items = [];
    if (tipo !== 'diario') veiculoRows.forEach(r => items.push({ tipo: 'veiculo', data: r.dataRealizacao, ...r }));
    if (tipo !== 'veiculo') diarioRows.forEach(r => items.push({ tipo: 'diario', data: r.semanaInicio, ...r }));
    items.sort((a, b) => (b.data || '').localeCompare(a.data || ''));

    document.getElementById('summaryWrap').innerHTML = `
      <div class="stat"><b>${veiculoRows.length}</b>checklists de veículo</div>
      <div class="stat"><b>${diarioRows.length}</b>semanas (diário)</div>
      ${veiculoRows.length ? `<div class="stat"><b>${Math.round(veiculoRows.reduce((s, r) => s + Number(r.percentual || 0), 0) / veiculoRows.length)}%</b>média de acerto</div>` : ''}
    `;

    if (!items.length) { wrap.innerHTML = '<div class="empty">Nenhum checklist encontrado com esses filtros.</div>'; return; }

    wrap.innerHTML = items.map((r, i) => {
      if (r.tipo === 'veiculo') {
        const pct = Math.round(Number(r.percentual || 0));
        return `<div class="resultcard" data-i="${i}">
          <div class="resultrow" data-toggle="${i}">
            <span class="tipo-badge">VEÍCULO</span>
            <div class="info">
              <div class="motorista">${escH(r.motorista) || '—'}</div>
              <div class="sub">${escH(r.placaCavalo)} · ${escH(r.dataRealizacao)}</div>
            </div>
            <div class="pct ${pctClass(pct)}">${pct}%</div>
          </div>
          <div class="resultdetail" id="detail-${i}">
            <div>Unidade: ${escH(r.unidade) || '—'} · Produto: ${escH(r.produto) || '—'}</div>
            <div>Placas: ${escH([r.placaCavalo, r.placaCarreta1, r.placaCarreta2].filter(Boolean).join(' / '))}</div>
            ${renderNokList(r.itensJson)}
            ${r.observacoes ? `<div style="margin-top:8px;"><b>Observações:</b> ${escH(r.observacoes)}</div>` : ''}
            ${(r.operador || r.responsavel) ? `<div style="margin-top:4px; color:var(--ink-soft);">Operador WAFRAN: ${escH(r.operador) || '—'} · Responsável pelo veículo: ${escH(r.responsavel) || '—'}</div>` : ''}
            ${linkPdf(r.driveUrl)}
          </div>
        </div>`;
      }
      return `<div class="resultcard" data-i="${i}">
        <div class="resultrow" data-toggle="${i}">
          <span class="tipo-badge">DIÁRIO</span>
          <div class="info">
            <div class="motorista">${escH(r.motorista) || '—'}</div>
            <div class="sub">${escH(r.placaCavalo)} · semana de ${escH(r.semanaInicio)}${r.finalizado ? '' : ' (em preenchimento)'}</div>
          </div>
          <div class="pct ${r.finalizado ? 'ok' : 'warn'}">${r.finalizado ? '✓' : '…'}</div>
        </div>
        <div class="resultdetail" id="detail-${i}">
          <div>Status: ${r.finalizado ? 'Semana finalizada' : 'Ainda em preenchimento'}</div>
          ${linkPdf(r.driveUrl) || '<div style="color:var(--ink-soft); margin-top:6px;">PDF disponível quando a semana for finalizada.</div>'}
        </div>
      </div>`;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(row => {
      row.addEventListener('click', () => {
        document.getElementById('detail-' + row.getAttribute('data-toggle')).classList.toggle('open');
      });
    });
  }

  // Texto livre digitado por motoristas (unidade, observações, descrição de NOK...)
  // nunca pode virar HTML dentro do painel do gestor.
  function escH(v) {
    return (v === undefined || v === null ? '' : String(v))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function linkPdf(url) {
    return /^https:\/\/(drive|docs)\.google\.com\//.test(url || '') ? `<a class="pdf" href="${escH(url)}" target="_blank" rel="noopener">📄 Abrir PDF</a>` : '';
  }

  function renderNokList(itensJson) {
    if (!itensJson) return '';
    let itens;
    try { itens = JSON.parse(itensJson); } catch (e) { return ''; }
    const noks = itens.filter(it => it.resposta === 'NOK');
    if (!noks.length) return '<div style="color:var(--ok); margin-top:6px;">Nenhum item reprovado ✓</div>';
    return `<div style="margin-top:8px;"><b>Itens reprovados (NOK):</b><ul class="noklist">${noks.map(n => `<li>${escH(n.id)}. ${escH(n.texto)}${n.obs ? ' — ' + escH(n.obs) : ''}</li>`).join('')}</ul></div>`;
  }

  async function aplicarFiltros() {
    const wrap = document.getElementById('resultsWrap');
    const msg = document.getElementById('panelMsg');
    wrap.innerHTML = '<div class="empty">Carregando...</div>';
    msg.textContent = '';
    const filtros = {
      motorista: document.getElementById('fMotorista').value,
      placa: document.getElementById('fPlaca').value.trim().toUpperCase(),
      dataDe: document.getElementById('fDataDe').value,
      dataAte: document.getElementById('fDataAte').value,
    };
    try {
      const [resV, resD] = await Promise.all([
        callApi('chk_list_veiculo', filtros),
        callApi('chk_list_diario', filtros),
      ]);
      if (!resV.ok || !resD.ok) { msg.textContent = 'Erro: ' + (resV.error || resD.error); return; }
      renderResults(resV.itens || [], resD.itens || []);
    } catch (e) {
      msg.textContent = 'Erro de conexão ao buscar os checklists.';
      wrap.innerHTML = '';
    }
  }

  document.getElementById('filtrarBtn').addEventListener('click', aplicarFiltros);
  document.getElementById('limparBtn').addEventListener('click', () => {
    document.getElementById('fTipo').value = '';
    document.getElementById('fMotorista').value = '';
    document.getElementById('fPlaca').value = '';
    document.getElementById('fDataDe').value = '';
    document.getElementById('fDataAte').value = '';
    aplicarFiltros();
  });
  document.getElementById('fTipo').addEventListener('change', aplicarFiltros);

  if (chkPass && chkTipo === 'gestor') {
    loadMotoristas();
    aplicarFiltros();
  }
</script>
</body>
</html>
