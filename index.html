      --route: #ff8f47; --route-soft: #3a2414; --diesel: #e2a840; --diesel-soft: #33291a;
      --arla: #6fa8d8; --arla-soft: #1a2733; --card: #1e2225; --border: #33383c;
      --shadow: rgba(0,0,0,.45); --here: #e0685a; --here-soft: #3a221d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14171a; --paper-2: #1b1f22; --ink: #ece9e1; --ink-soft: #9aa0a4;
    --route: #ff8f47; --route-soft: #3a2414; --diesel: #e2a840; --diesel-soft: #33291a;
    --arla: #6fa8d8; --arla-soft: #1a2733; --card: #1e2225; --border: #33383c;
    --shadow: rgba(0,0,0,.45); --here: #e0685a; --here-soft: #3a221d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  .brand { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .01em; }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    background: var(--asphalt); color: var(--header-ink);
    padding: 14px 18px 0; border-bottom: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--brand-1), var(--brand-2), var(--brand-3)) 1;
  }
  header .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1; }
  header .tag { font-size: 11px; color: #cfd4d1; letter-spacing: .02em; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
  header .tag .tagLogo { border-radius: 3px; flex: none; }
  .themebtn {
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: var(--header-ink);
    border-radius: 999px; width: 34px; height: 34px; font-size: 15px; flex: none; cursor: pointer;
  }
  .fuelchips { margin-top: 10px; display: flex; gap: 8px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .chip.diesel { background: var(--diesel); color: #241a05; }
  .chip.arla { background: var(--arla); color: #06121d; }
  .chip.bandeira { background: var(--paper-2); color: var(--ink); border: 1px solid var(--border); }

  .routetabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px 16px;
    -webkit-overflow-scrolling: touch;
    justify-content: center; justify-content: safe center;
    scrollbar-width: thin; scrollbar-color: transparent transparent;
    transition: scrollbar-color .2s;
  }
  .routetabs:hover { scrollbar-color: rgba(255,255,255,.35) transparent; }
  .routetabs::-webkit-scrollbar { height: 6px; }
  .routetabs::-webkit-scrollbar-track { background: transparent; }
  .routetabs::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
  .routetabs:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,.35); }
  .routetab {
    flex: none; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600;
    padding: 7px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
    background: transparent; color: #d7dbd8; cursor: pointer; white-space: nowrap;
  }
  .routetab.active { background: var(--route); border-color: var(--route); color: #fff; }

  .searchwrap { padding: 14px 18px 6px; position: relative; }
  #search {
    width: 100%; padding: 13px 42px 13px 16px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 16px; font-family: inherit; outline: none;
  }
  #search:focus { border-color: var(--route); }
  .searchwrap::after {
    content: "🔍"; position: absolute; right: 32px; top: 27px; font-size: 15px; opacity: .6; pointer-events: none;
  }
  #results {
    position: absolute; left: 18px; right: 18px; top: 60px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 28px var(--shadow);
    overflow: hidden; z-index: 50; display: none;
  }
  #results.open { display: block; }
  .result-item { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .result-item:last-child { border-bottom: none; }
  .result-item:active { background: var(--paper-2); }
  .result-item.disabled { cursor: default; opacity: .6; }
  .result-item .rname { font-weight: 600; font-size: 14.5px; }
  .result-item .rcity { font-size: 12.5px; color: var(--ink-soft); }
  .result-empty { padding: 16px; font-size: 13.5px; color: var(--ink-soft); }

  .locwrap { padding: 4px 18px 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .locbtn {
    font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink); cursor: pointer; font-family: inherit; flex: none;
  }
  .locbtn.active { background: var(--here); border-color: var(--here); color: #fff; }
  .locstatus { font-size: 12px; color: var(--ink-soft); flex: 1; min-width: 140px; }

  main { padding: 8px 0 40px; min-height: 200px; }
  .routewrap { padding: 10px 18px 0; }
  .routewrap p.lead { font-size: 13px; color: var(--ink-soft); margin: 4px 0 14px; max-width: 62ch; }

  .loadingmsg, .errormsg { padding: 30px 18px; font-size: 14px; color: var(--ink-soft); text-align: center; }
  .errormsg { color: var(--here); }

  .stop { display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; }
  .stopline { position: relative; display: flex; flex-direction: column; align-items: center; }
  .dot {
    width: 18px; height: 18px; border-radius: 50%; background: var(--route); border: 3px solid var(--paper);
    box-shadow: 0 0 0 2px var(--route); margin-top: 6px; flex: none; cursor: pointer;
  }
  .dot.dot-empty { background: var(--paper-2); box-shadow: 0 0 0 2px var(--empty); cursor: default; }
  .dot.pulse { animation: pulse 1.1s ease-out 2; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 2px var(--route); } 50% { box-shadow: 0 0 0 8px var(--route-soft); } 100% { box-shadow: 0 0 0 2px var(--route); } }
  .stopline .bar { width: 3px; flex: 1; background: var(--route); opacity: .55; margin-top: 2px; }
  .stop:last-child .stopline .bar { display: none; }

  .stopcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; margin-bottom: 14px; cursor: pointer; position: relative; }
  .stopcard:active { transform: scale(.995); }
  .stopcard.empty { cursor: default; background: transparent; border: 1.5px dashed var(--empty); }
  .stopcard.empty:active { transform: none; }
  .stopcard .city { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 600; line-height: 1.05; }
  .stopcard .postname { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }
  .stopcard .empty-msg { font-size: 13px; color: var(--ink-soft); margin-top: 4px; font-style: italic; }
  .stopcard .metarow { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .metarow .badge247 { font-size: 11px; font-weight: 600; color: var(--route); border: 1px solid var(--route); border-radius: 999px; padding: 2px 8px; }
  .metarow .badgestatus { font-size: 11px; font-weight: 700; color: #fff; background: var(--route); border-radius: 999px; padding: 2px 9px; letter-spacing: .01em; }
  .metarow .chip { padding: 2px 8px; font-size: 10.5px; }

  .stopcard.here { border: 2px solid var(--here); box-shadow: 0 0 0 4px var(--here-soft); }
  .stopcard.here::before {
    content: "📍 Você está aqui"; position: absolute; top: -12px; right: 12px; background: var(--here);
    color: #fff; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  }
  .here-between { display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; margin-bottom: 14px; }
  .here-dot {
    width: 26px; height: 26px; border-radius: 50%; background: var(--here); border: none;
    box-shadow: 0 0 0 4px var(--here-soft); margin-top: 2px; display: flex; align-items: center;
    justify-content: center; font-size: 13px; animation: pulse-here 1.6s ease-in-out infinite;
  }
  @keyframes pulse-here { 0%, 100% { box-shadow: 0 0 0 4px var(--here-soft); } 50% { box-shadow: 0 0 0 9px var(--here-soft); } }
  .here-card { background: var(--here-soft); border: 1.5px dashed var(--here); border-radius: 14px; padding: 11px 14px; font-size: 13.5px; color: var(--ink); align-self: start; }
  .here-sub { font-size: 12px; color: var(--ink-soft); }

  footer { padding: 18px 18px 30px; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--border); margin-top: 6px; }

  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%); transition: transform .25s ease; max-height: 78vh; overflow-y: auto;
    box-shadow: 0 -10px 30px var(--shadow);
  }
  #sheet.open { transform: translateY(0); }
  .grabber { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 6px auto 14px; }
  #sheet h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 2px; }
  #sheet .sheet-city { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
  .sheet-chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .infoline { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .infoline .ic { flex: none; width: 20px; text-align: center; }
  .infoline a { color: var(--route); text-decoration: none; font-weight: 600; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; text-align: center; padding: 13px 14px; border-radius: 12px; font-weight: 600; font-size: 14.5px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--route); color: #fff; }
  .btn.ghost { background: var(--paper-2); color: var(--ink); border: 1px solid var(--border); }

  @media (min-width: 720px) {
    #sheet { left: 50%; right: auto; transform: translate(-50%, 100%); width: 560px; border-radius: 20px; bottom: 24px; }
    #sheet.open { transform: translate(-50%, 0); }
  }
</style>
</head>

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkxZpP4eeVssIpNLuJq8dlc3ljWG-4qAj6sk7GXYnaMjFTaypwqst6UVqMRHieEht3/exec";
  // Abas cujo nome começa com "_" são ignoradas (úteis para rascunhos/config).
  // APPS_SCRIPT_URL é opcional: se ficar em branco/placeholder, o site funciona
  // normalmente só sem aplicar o tema de campanha definido no painel admin.
  // ======================================================================

  const THEME_PRESETS = {
    default:            { route: "#e8711f", routeSoft: "#fbe3cc" },
    setembro_amarelo:   { route: "#d4a017", routeSoft: "#f7edd2" },
    outubro_rosa:       { route: "#d6336c", routeSoft: "#f9dce6" },
    novembro_azul:      { route: "#1e63c4", routeSoft: "#dbe8f9" },
    dezembro_vermelho:  { route: "#c1272d", routeSoft: "#f4d6d7" },
  };

  let routesData = {};
  let activeRoute = null;
  let stations = [];
  let watchId = null;

  function normalize(str) {
    return (str || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function toNumber(v) {
    // aceita número já numérico (UNFORMATTED_VALUE) ou texto com vírgula decimal (locale BR)
    if (typeof v === 'number') return v;
    if (v === undefined || v === null || v === '') return NaN;
    return parseFloat(v.toString().trim().replace(',', '.'));
  }
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function mapsLink(lat, lon) {
    return `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  }

  // ---- CARREGAMENTO DA PLANILHA ----
  async function loadRoutesFromSheet() {
    const stopsList = document.getElementById('stopsList');
    try {
      const metaUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?key=${API_KEY}&fields=sheets.properties.title`;
      const metaRes = await fetch(metaUrl);
      if (!metaRes.ok) throw new Error(`Falha ao ler abas (HTTP ${metaRes.status})`);
      const meta = await metaRes.json();
      const tabNames = meta.sheets.map(s => s.properties.title).filter(t => !t.startsWith('_'));
      if (tabNames.length === 0) throw new Error("Nenhuma aba de rota encontrada na planilha.");

      for (const tab of tabNames) {
        const valuesUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent("'" + tab + "'")}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE`;
        const valRes = await fetch(valuesUrl);
        if (!valRes.ok) continue;
        const valJson = await valRes.json();
        routesData[tab] = parseSheetRows(valJson.values || []);
      }

      renderRouteTabs(tabNames.filter(t => routesData[t] && routesData[t].length));
    } catch (err) {
      stopsList.innerHTML = `<div class="errormsg">Não foi possível carregar a planilha.<br>${err.message}<br><br>Confira o SPREADSHEET_ID, a API_KEY e se a planilha está compartilhada como "Qualquer pessoa com o link pode visualizar".</div>`;
    }
  }

  function parseSheetRows(rows) {
    if (!rows || rows.length < 2) return [];
    const headers = rows[0].map(h => normalize(h).trim());
    return rows.slice(1)
      .filter(r => r.length && r[0]) // precisa ao menos da cidade preenchida
      .map((r, i) => {
        const raw = {};
        headers.forEach((h, idx) => { raw[h] = r[idx] !== undefined ? r[idx] : ""; });
        const name = (raw.name || raw.posto || "").trim();
        // "posto liberado" é decidido por uma coluna própria (posto liberado / liberado / tem posto),
        // aceitando Sim/Não, TRUE/FALSE, 1/0. Sem essa coluna, cai no fallback: tem nome preenchido = liberado.
        const flagRaw = (raw["posto liberado"] || raw.liberado || raw["tem posto"] || raw.postoliberado || "").toString().trim().toLowerCase();
        let hasPosto;
        if (flagRaw !== "") {
          hasPosto = ["sim", "s", "true", "1", "liberado", "x"].includes(flagRaw);
        } else {
          hasPosto = name.length > 0; // planilha sem essa coluna: mantém comportamento antigo
        }
        return {
          id: i + 1,
          city: raw.city || raw.cidade || "",
          uf: raw.uf || "",
          lat: toNumber(raw.lat),
          lon: toNumber(raw.lon || raw.lng || raw.long),
          hasPosto: hasPosto,
          name: name,
          bandeira: raw.bandeira || "",
          prazo: raw.prazo || "",
          dataCotacao: raw.datacotacao || raw["data da cotacao"] || "",
          status: raw.status || "Liberado",
          address: raw.address || raw.endereco || "",
          phone: raw.phone || raw.telefone || "",
          hours: raw.hours || raw.horario || "",
        };
      })
      .filter(s => !isNaN(s.lat) && !isNaN(s.lon)); // toda cidade precisa de coordenada, mesmo sem posto
  }

  // ---- ABAS / SELETOR DE ROTA ----
  function prettyRouteName(name) {
    return name.replace(/[_-]+/g, " → ");
  }
  function renderRouteTabs(tabNames) {
    const wrap = document.getElementById('routeTabs');
    wrap.innerHTML = tabNames.map(t =>
      `<button class="routetab" data-tab="${t}">${prettyRouteName(t)}</button>`
    ).join('');
    wrap.querySelectorAll('.routetab').forEach(btn => {
      btn.addEventListener('click', () => selectRoute(btn.getAttribute('data-tab')));
    });
    if (tabNames.length) selectRoute(tabNames[0]);
  }
  function selectRoute(tab) {
    activeRoute = tab;
    stations = routesData[tab] || [];
    document.querySelectorAll('.routetab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
    const liberados = stations.filter(s => s.hasPosto).length;
    document.getElementById('routeLead').textContent = stations.length
      ? `${stations[0].city} → ${stations[stations.length - 1].city}. ${liberados} de ${stations.length} cidades com posto liberado.`
      : 'Esta rota ainda não tem cidades cadastradas.';
    clearLocationUI();
    renderStops();
  }

  // ---- RENDER DA ROTA ----
  function renderStops() {
    const stopsList = document.getElementById('stopsList');
    stopsList.innerHTML = '';
    stations.forEach((s, i) => {
      const stop = document.createElement('div');
      stop.className = 'stop';
      stop.setAttribute('data-stopid', s.id);
      if (s.hasPosto) {
        stop.innerHTML = `
          <div class="stopline"><div class="dot" data-id="${s.id}"></div><div class="bar"></div></div>
          <div class="stopcard" data-id="${s.id}">
            <div class="city">${i+1}. ${s.city} <span style="font-size:14px;color:var(--ink-soft);font-family:'Inter',sans-serif;">- ${s.uf}</span></div>
            <div class="postname">${s.name}</div>
            <div class="metarow">
              <span class="badgestatus">${s.status || 'Liberado'}</span>
              ${s.hours === '24 horas' ? '<span class="badge247">24H</span>' : ''}
              ${s.bandeira ? `<span class="chip bandeira">${s.bandeira}</span>` : ''}
              <span class="chip diesel">S10</span>
            </div>
          </div>`;
      } else {
        stop.innerHTML = `
          <div class="stopline"><div class="dot dot-empty" data-id="${s.id}"></div><div class="bar"></div></div>
          <div class="stopcard empty" data-id="${s.id}">
            <div class="city">${i+1}. ${s.city} <span style="font-size:14px;color:var(--ink-soft);font-family:'Inter',sans-serif;">- ${s.uf}</span></div>
            <div class="empty-msg">Sem posto liberado</div>
          </div>`;
      }
      stopsList.appendChild(stop);
    });
    document.querySelectorAll('.stopcard:not(.empty), .dot:not(.dot-empty)').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.getAttribute('data-id'));
        const station = stations.find(s => s.id === id);
        if (station && station.hasPosto) openSheet(station);
      });
    });
  }

  // ---- FICHA DO POSTO ----
  const overlay = document.getElementById('overlay');
  const sheetEl = document.getElementById('sheet');
  const sheetContent = document.getElementById('sheetContent');

  function openSheet(station) {
    sheetContent.innerHTML = `
      <h2>${station.name}</h2>
      <div class="sheet-city">${station.city} - ${station.uf}</div>
      <div class="sheet-chips">
        <span class="badgestatus">${station.status || 'Liberado'}</span>
        ${station.bandeira ? `<span class="chip bandeira">${station.bandeira}</span>` : ''}
        <span class="chip diesel">⛽ Diesel S10</span>
        ${station.hours === '24 horas' ? '<span class="badge247" style="align-self:center;">24H</span>' : ''}
      </div>
      ${station.address ? `<div class="infoline"><span class="ic">📍</span><span>${station.address}</span></div>` : ''}
      ${station.hours ? `<div class="infoline"><span class="ic">🕒</span><span>${station.hours}</span></div>` : ''}
      <div class="infoline"><span class="ic">📞</span><span>${station.phone ? `<a href="tel:${station.phone.replace(/\\s/g,'')}">${station.phone}</a>` : 'Não informado'}</span></div>
      ${(station.dataCotacao || station.prazo) ? `<div class="infoline"><span class="ic">📅</span><span>${station.dataCotacao ? 'Cotação de ' + station.dataCotacao : ''}${station.dataCotacao && station.prazo ? ' · ' : ''}${station.prazo ? 'prazo ' + station.prazo : ''}</span></div>` : ''}
      <div class="sheet-actions">
        <a class="btn primary" href="${mapsLink(station.lat, station.lon)}" target="_blank" rel="noopener">Abrir no Maps</a>
        <button class="btn ghost" id="closeSheet">Fechar</button>
      </div>
    `;
    document.getElementById('closeSheet').onclick = closeSheet;
    overlay.classList.add('open');
    sheetEl.classList.add('open');
  }
  function closeSheet() { overlay.classList.remove('open'); sheetEl.classList.remove('open'); }
  overlay.addEventListener('click', closeSheet);

  // ---- BUSCA ----
  const searchInput = document.getElementById('search');
  const resultsBox = document.getElementById('results');
  function renderResults(query) {
    const q = normalize(query.trim());
    if (!q) { resultsBox.classList.remove('open'); resultsBox.innerHTML = ''; return; }
    const matches = stations.filter(s => normalize(s.city).includes(q) || (s.name && normalize(s.name).includes(q)) || normalize(s.uf).includes(q));
    if (matches.length === 0) {
      resultsBox.innerHTML = `<div class="result-empty">Nenhuma cidade encontrada em "${activeRoute}" para "${query}".</div>`;
    } else {
      resultsBox.innerHTML = matches.map(s => `
        <div class="result-item ${s.hasPosto ? '' : 'disabled'}" data-id="${s.id}">
          <div>
            <div class="rname">${s.hasPosto ? s.name : s.city}</div>
            <div class="rcity">${s.city} - ${s.uf}${s.hasPosto ? '' : ' · sem posto liberado'}</div>
          </div>
          ${s.hasPosto && s.bandeira ? `<span class="chip bandeira">${s.bandeira}</span>` : ''}
        </div>`).join('');
    }
    resultsBox.classList.add('open');
    resultsBox.querySelectorAll('.result-item:not(.disabled)').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.getAttribute('data-id'));
        const station = stations.find(s => s.id === id);
        resultsBox.classList.remove('open');
        searchInput.value = '';
        searchInput.blur();
        if (station) {
          openSheet(station);
          const dot = document.querySelector(`.dot[data-id="${id}"]`);
          if (dot) {
            dot.classList.add('pulse');
            dot.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => dot.classList.remove('pulse'), 2400);
          }
        }
      });
    });
  }
  searchInput.addEventListener('input', (e) => renderResults(e.target.value));
  document.addEventListener('click', (e) => { if (!e.target.closest('.searchwrap')) resultsBox.classList.remove('open'); });

  // ---- LOCALIZAÇÃO DO MOTORISTA ----
  const LOCATE_THRESHOLD_KM = 12;
  const locBtn = document.getElementById('locBtn');
  const locStatus = document.getElementById('locStatus');

  function classifyPosition(lat, lon) {
    const distances = stations.map(s => ({ s, d: haversine(lat, lon, s.lat, s.lon) }));
    distances.sort((a, b) => a.d - b.d);
    const nearest = distances[0];
    if (nearest.d <= LOCATE_THRESHOLD_KM) return { type: 'at', station: nearest.s, dist: nearest.d };
    const idx = stations.findIndex(s => s.id === nearest.s.id);
    const candidates = [];
    if (idx > 0) candidates.push([stations[idx - 1], stations[idx]]);
    if (idx < stations.length - 1) candidates.push([stations[idx], stations[idx + 1]]);
    let best = null;
    candidates.forEach(([A, B]) => {
      const dA = haversine(lat, lon, A.lat, A.lon);
      const dB = haversine(lat, lon, B.lat, B.lon);
      const dAB = haversine(A.lat, A.lon, B.lat, B.lon);
      const slack = (dA + dB) - dAB;
      if (!best || slack < best.slack) best = { A, B, dA, dB, dAB, slack };
    });
    return best ? { type: 'between', before: best.A, after: best.B, distFromBefore: best.dA } : { type: 'none' };
  }
  function clearLocationUI() {
    document.querySelectorAll('.stopcard.here').forEach(el => el.classList.remove('here'));
    const old = document.getElementById('hereBetween');
    if (old) old.remove();
  }
  function renderLocation(pos) {
    const { latitude, longitude, accuracy } = pos.coords;
    if (!stations.length) return;
    const result = classifyPosition(latitude, longitude);
    clearLocationUI();
    if (result.type === 'at') {
      const card = document.querySelector(`.stopcard[data-id="${result.station.id}"]`);
      if (card) card.classList.add('here');
      const extra = result.station.hasPosto ? '' : ' (sem posto liberado aqui)';
      locStatus.textContent = `Você está em ${result.station.city} - ${result.station.uf}${extra} (±${Math.round(accuracy)} m)`;
    } else if (result.type === 'between') {
      const beforeStop = document.querySelector(`.stop[data-stopid="${result.before.id}"]`);
      const marker = document.createElement('div');
      marker.id = 'hereBetween';
      marker.className = 'here-between';
      marker.innerHTML = `
        <div class="here-dot">🚚</div>
        <div class="here-card">Você está aqui — entre <strong>${result.before.city}</strong> e <strong>${result.after.city}</strong>
        <div class="here-sub">≈ ${Math.round(result.distFromBefore)} km depois de ${result.before.city}</div></div>`;
      if (beforeStop) beforeStop.after(marker);
      locStatus.textContent = `Entre ${result.before.city} e ${result.after.city} (±${Math.round(accuracy)} m)`;
    }
  }
  function renderLocationError(err) {
    let msg = 'Não foi possível obter sua localização.';
    if (err && err.code === 1) msg = 'Permissão de localização negada.';
    else if (err && err.code === 2) msg = 'Localização indisponível no momento.';
    else if (err && err.code === 3) msg = 'Tempo esgotado ao buscar localização.';
    locStatus.textContent = msg;
  }
  locBtn.addEventListener('click', () => {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      locBtn.textContent = '📍 Ativar localização';
      locBtn.classList.remove('active');
      locStatus.textContent = 'Localização desativada.';
      clearLocationUI();
      return;
    }
    if (!navigator.geolocation) { locStatus.textContent = 'Este navegador não suporta geolocalização.'; return; }
    locStatus.textContent = 'Obtendo localização...';
    watchId = navigator.geolocation.watchPosition(renderLocation, renderLocationError, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
    locBtn.textContent = '🛑 Parar localização';
    locBtn.classList.add('active');
  });

  // ---- TEMA ----
  document.getElementById('themeToggle').addEventListener('click', () => {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    if (current === 'dark') root.setAttribute('data-theme', 'light');
    else if (current === 'light') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', 'dark');
  });

  // ---- TEMA DE CAMPANHA (definido no painel admin.html) ----
  // O Apps Script sempre redireciona (302) toda chamada ao /exec pra outro
  // domínio, e essa resposta final não manda cabeçalho de CORS — então
  // fetch() é sempre bloqueado. JSONP contorna isso carregando a resposta
  // como uma tag <script>, que não passa pela checagem de CORS.
  function jsonpTheme() {
    return new Promise((resolve, reject) => {
      const cbName = '__traxia_theme_cb_' + Date.now();
      const script = document.createElement('script');
      const timeoutId = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 10000);
      function cleanup() { clearTimeout(timeoutId); delete window[cbName]; script.remove(); }
      window[cbName] = (data) => { cleanup(); resolve(data); };
      script.src = `${APPS_SCRIPT_URL}?action=get_theme&callback=${cbName}`;
      script.onerror = () => { cleanup(); reject(new Error('falha ao carregar')); };
      document.body.appendChild(script);
    });
  }
  async function loadCampaignTheme() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith('COLOQUE_AQUI')) return;
    try {
      const res = await jsonpTheme();
      if (!res || !res.ok) return;
      let css = '';
      const preset = THEME_PRESETS[res.theme_active];
      if (preset) {
        css += `:root:not([data-theme="dark"]) { --route: ${preset.route}; --route-soft: ${preset.routeSoft}; }\n`;
        css += `:root[data-theme="dark"] { --route: ${preset.route}; }\n`;
      }
      if (res.theme_css) css += res.theme_css;
      if (css) {
        const style = document.createElement('style');
        style.id = 'campaignTheme';
        style.textContent = css;
        document.head.appendChild(style);
      }
      if (res.footer_message && res.footer_message.trim()) {
        document.getElementById('footerMsg').textContent = res.footer_message;
      }
    } catch (e) { /* sem tema, segue com o padrão */ }
  }

  // ---- INÍCIO ----
  loadRoutesFromSheet();
  loadCampaignTheme();
</script>
</body>
</html>
